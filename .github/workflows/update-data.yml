name: Mise à jour des données

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # chaque jour, 4h17 UTC (5h17 ou 6h17 à Paris)
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/groupes.csv"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire data/installations.json
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pip install --quiet duckdb
          set -o pipefail
          python scripts/build_data.py 2>&1 | tee data/build_log.txt
      - name: Publier si changement
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données : mise à jour $(date -u +%Y-%m-%d)"
            git pull --rebase origin main && git push
          fi
