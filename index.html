<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18212b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PV & BESS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Carte PV & BESS France</title>
<meta name="description" content="Installations photovoltaïques et de stockage par batteries de plus de 1 MW en service en France (Registre national ODRÉ).">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#18212b; --muted:#5d6b7a; --line:#e2e6eb;
  --pv:#f2a20c; --pv-stroke:#a8650a; --bess:#4c4fe0; --bess-stroke:#2a2c9c;
  --accent:#18212b; --chip:#eef1f4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:flex;height:100%}
aside{width:340px;flex:0 0 340px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;z-index:1000}
.head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.head h1{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.head p{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}
.stat{background:var(--chip);border-radius:8px;padding:8px 8px 7px}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.stat.pv b{color:var(--pv-stroke)} .stat.bess b{color:var(--bess)}
form{padding:12px 18px 18px;overflow:auto;flex:1}
fieldset{border:0;margin:0 0 14px;padding:0}
legend,label.lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
select,input[type=search],input[type=number]{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
select:focus,input:focus{outline:2px solid #18212b22;border-color:#9aa6b2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types{display:flex;gap:8px}
.tbtn{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px;user-select:none;background:#fff}
.tbtn input{display:none}
.tbtn .dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.tbtn:has(input:not(:checked)){opacity:.45;background:var(--chip)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.chips button:hover{background:#e3e7ec}
.sizes-f{display:flex;flex-wrap:wrap;gap:6px}
.sizes-f label{display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;user-select:none;background:#fff}
.sizes-f label input{margin:0;accent-color:#18212b}
.sizes-f label small{color:var(--muted);font-size:11px}
.sizes-f label:has(input:not(:checked)){background:var(--chip);color:var(--muted);text-decoration:line-through;opacity:.7}
.sizes-act{display:flex;gap:10px;margin-top:6px}
.sizes-act button{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.actions{display:flex;gap:8px;margin-top:6px}
.actions button{flex:1;font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:9px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.legend{padding:12px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend .sizes{display:flex;align-items:flex-end;gap:14px;margin-top:6px}
.legend .sizes div{display:flex;flex-direction:column;align-items:center;gap:3px}
.legend .sizes i{display:block;border-radius:50%;background:#9aa6b233;border:1px solid #6b7887}
.foot{padding:8px 18px 12px;font-size:11px;color:var(--muted);line-height:1.45}
.foot a{color:inherit}
#map{flex:1;height:100%}
.leaflet-control-layers{font:13px Inter,system-ui,sans-serif;border-radius:10px!important;box-shadow:0 4px 16px #0f172a26!important;border:0!important}
.leaflet-control-layers-base label{margin:2px 0}
@media (max-width:760px){.leaflet-control-layers{font-size:12px}}
.leaflet-tooltip.inst{border:0;border-radius:10px;box-shadow:0 6px 24px #0f172a2e;padding:10px 12px;font:13px/1.4 Inter,system-ui,sans-serif;color:var(--ink);min-width:220px;max-width:300px;white-space:normal}
.inst h3{font-size:14px;margin:0 0 6px;line-height:1.25}
.inst .tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-bottom:6px;color:#fff}
.inst table{border-collapse:collapse;width:100%}
.inst td{padding:2px 0;vertical-align:top;font-size:12.5px}
.inst td:first-child{color:var(--muted);padding-right:10px;white-space:nowrap}
.inst .note{font-size:11px;color:var(--muted);margin-top:6px}
#toggle{display:none}
#cBox{position:relative}
#cSug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 24px #0f172a26;overflow:hidden;display:none}
#cSug.open{display:block}
#cSug button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:#fff;text-align:left;font:inherit;font-size:14px;
  padding:10px 12px;cursor:pointer;color:var(--ink);border-bottom:1px solid #f0f2f5}
#cSug button:last-child{border-bottom:0}
#cSug button:hover,#cSug button.act{background:#f3f5f8}
#cSug button small{color:var(--muted);white-space:nowrap}
#cSug .msg{padding:10px 12px;font-size:13px;color:var(--muted)}
.csel{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #18212b;box-shadow:inset 0 0 0 1px #18212b;
  border-radius:8px;padding:7px 6px 7px 10px;font-size:14px;font-weight:600}
.csel button{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:0 6px}
.crow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.crow input{width:90px!important;text-align:right}
#cRes{margin-top:8px;font-size:12.5px;color:var(--muted)}
#cRes ol{list-style:none;margin:6px 0 0;padding:0;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
#cRes li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 10px;border-bottom:1px solid #f0f2f5;cursor:pointer;color:var(--ink)}
#cRes li:last-child{border-bottom:0}
#cRes li:hover{background:#f6f7f9}
#cRes li b{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cRes li span{font-size:11.5px;color:var(--muted)}
#cRes li em{font-style:normal;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}
#cRes li i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.picker{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font:inherit;font-size:14px;padding:8px 10px;
  border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;text-align:left}
.picker span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker i{font-style:normal;color:var(--muted)}
.picker.on{border-color:#18212b;box-shadow:inset 0 0 0 1px #18212b}
#explSheet{position:fixed;inset:0;z-index:3000;background:#0f172a55;display:none;align-items:center;justify-content:center;padding:16px}
#explSheet.open{display:flex}
#explSheet .sheet{background:#fff;border-radius:14px;width:100%;max-width:440px;height:min(640px,100%);display:flex;flex-direction:column;
  box-shadow:0 12px 40px #0f172a40;overflow:hidden}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.sh-head b{font-size:16px}
button.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
#explQ{margin:0 16px;width:calc(100% - 32px);font-size:16px}
.sh-tools{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:12px;color:var(--muted)}
.sh-tools button{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.sh-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line);overscroll-behavior:contain}
.sh-list label{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #f0f2f5;font-size:14px;cursor:pointer;min-height:44px}
.sh-list label input{width:18px;height:18px;flex:0 0 18px;accent-color:#18212b;margin:0}
.sh-list label span{flex:1;min-width:0;overflow-wrap:anywhere}
.sh-list label small{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-list .letter{position:sticky;top:0;background:#f6f7f9;font-size:11px;font-weight:700;color:var(--muted);padding:3px 16px;letter-spacing:.06em}
.sh-list .none{padding:24px 16px;color:var(--muted);font-size:14px}
.sh-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sh-foot button{width:100%;font:inherit;font-size:15px;font-weight:600;border-radius:10px;padding:12px;border:0;background:#18212b;color:#fff;cursor:pointer}
#card{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:2500;display:none;background:#fff;border-radius:14px;
  box-shadow:0 10px 36px #0f172a4d;padding:14px 16px 12px;max-height:62dvh;overflow-y:auto;font:14px/1.4 Inter,system-ui,sans-serif;max-width:480px;margin:0 auto}
#card.open{display:block}
#card .x{position:absolute;top:6px;right:6px}
#card .inst h3{font-size:15px;padding-right:28px}
#card .inst td{font-size:13.5px;padding:3px 0}
.card-act{display:flex;gap:8px;margin-top:10px}
.card-act a{flex:1;text-align:center;font-size:14px;font-weight:600;padding:10px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none}
.card-act a:first-child{background:#18212b;color:#fff;border-color:#18212b}
.loc-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#fff;border:0;cursor:pointer;font-size:18px;color:#18212b}
.loc-dot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 1px #1a73e855,0 2px 6px #0005;position:relative}
.loc-dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:#1a73e833;animation:locp 2s ease-out infinite}
@keyframes locp{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.3);opacity:0}}
.loc-btn.on{color:#1a73e8}
.loc-btn.wait svg{animation:locw 1s linear infinite}
@keyframes locw{50%{opacity:.3}}
#cardDist{font-size:13px;font-weight:600;color:#1a73e8;margin-top:6px}
#cardDist:empty{display:none}
.cme{margin-top:8px;width:100%;font:inherit;font-size:13px;font-weight:600;border:1px dashed #9aa6b2;background:#fff;color:#18212b;border-radius:8px;padding:8px;cursor:pointer}
.cme:disabled{opacity:.45;cursor:default}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:2000;background:#f6f7f9ee;padding:24px;text-align:center}
#empty div{max-width:440px;font-size:14px;line-height:1.5}
@media (max-width:760px){
  html,body{height:100dvh;overflow:hidden}
  #app{flex-direction:column;height:100dvh}
  #map{height:100dvh}
  aside{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:86dvh;border-right:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;transform:translateY(calc(100% - var(--peek, 150px)));transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -6px 24px #0f172a22;overflow-y:auto;z-index:1200;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding-bottom:env(safe-area-inset-bottom)}
  aside.open{transform:none}
  aside.dragging{transition:none}
  form{overflow:visible;flex:none}
  #toggle{display:block;width:100%;height:22px;background:none;border:0;padding:0;cursor:grab;position:sticky;top:0;z-index:2}
  #toggle::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#c6cdd5;margin:9px auto 0}
  .head{padding:0 16px 8px;cursor:pointer}
  .head h1{font-size:15px}
  .head p{font-size:11.5px}
  .stats{padding:8px 16px 10px;gap:6px}
  .stat{padding:6px 8px}
  .stat b{font-size:15px}
  form{padding:12px 16px 16px}
  select,input[type=search],input[type=number],.picker{font-size:16px;padding:10px 12px}
  .tbtn{padding:10px 12px;font-size:15px}
  .sizes-f label{padding:8px 12px;font-size:14px}
  .actions button{padding:12px;font-size:15px}
  #explSheet{padding:0;align-items:flex-end}
  #explSheet .sheet{max-width:none;height:92dvh;border-radius:16px 16px 0 0}
  .leaflet-control-layers{font-size:13px}
  .leaflet-top{top:env(safe-area-inset-top)}
  .leaflet-bottom{bottom:var(--peek, 150px)}
  .leaflet-control-attribution{font-size:10px}
  #edToggle,#edBar{display:none!important}
}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <button id="toggle" aria-label="Afficher les filtres"></button>
    <div class="head">
      <h1>Centrales PV & BESS &gt; 1 MW en service</h1>
      <p id="sub">Chargement des données…</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sN">–</b><span>projets affichés</span></div>
      <div class="stat pv"><b id="sPV">–</b><span>MW PV</span></div>
      <div class="stat bess"><b id="sBESS">–</b><span>MW BESS</span></div>
    </div>
    <form id="f" autocomplete="off" onsubmit="return false">
      <fieldset>
        <legend>Type</legend>
        <div class="types">
          <label class="tbtn"><input type="checkbox" name="t" value="PV" checked><span class="dot" style="background:var(--pv)"></span>Photovoltaïque</label>
          <label class="tbtn"><input type="checkbox" name="t" value="BESS" checked><span class="dot" style="background:var(--bess)"></span>Batteries</label>
        </div>
      </fieldset>
      <fieldset>
        <label class="lbl" for="region">Région</label>
        <select id="region"><option value="">Toutes les régions</option></select>
      </fieldset>
      <fieldset class="near">
        <label class="lbl" for="cq">Autour d'une commune</label>
        <div id="cBox">
          <input type="search" id="cq" placeholder="Nom ou code postal…" autocomplete="off" enterkeyhint="search"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cSug">
          <div id="cSug" role="listbox"></div>
          <button type="button" id="cMe" class="cme" title="Utiliser ma position GPS comme centre">📍 Autour de ma position</button>
        </div>
        <div id="cSel" hidden>
          <div class="csel"><span id="cName"></span><button type="button" id="cClear" aria-label="Retirer la commune">×</button></div>
          <div class="crow"><label for="km">Rayon</label><input type="number" id="km" min="1" max="300" step="1" value="20" inputmode="numeric"><span>km</span></div>
          <div id="cRes"></div>
        </div>
      </fieldset>
      <fieldset>
        <label class="lbl" for="explBtn">Exploitant</label>
        <button type="button" id="explBtn" class="picker" aria-haspopup="dialog"><span id="explTxt">Tous les exploitants</span><i>▾</i></button>
        <datalist id="explList"></datalist>
      </fieldset>
      <fieldset>
        <legend>Puissance (MW)</legend>
        <div class="sizes-f" id="sizesF"></div>
        <div class="sizes-act"><button type="button" id="sAll">Toutes</button><button type="button" id="sNone">Aucune</button></div>
        <div class="row2" style="margin-top:8px">
          <input type="number" id="pmin" min="0" step="0.5" placeholder="min libre" aria-label="Puissance minimale (MW)">
          <input type="number" id="pmax" min="0" step="0.5" placeholder="max libre" aria-label="Puissance maximale (MW)">
        </div>
      </fieldset>
      <fieldset>
        <legend>Mise en service</legend>
        <div class="row2">
          <input type="number" id="y1" min="1990" max="2100" placeholder="depuis (année)">
          <input type="number" id="y2" min="1990" max="2100" placeholder="jusqu'à">
        </div>
      </fieldset>
      <fieldset>
        <label class="lbl" for="q">Recherche</label>
        <input type="search" id="q" placeholder="Nom, commune, département…">
      </fieldset>
      <div class="actions">
        <button type="button" id="reset">Réinitialiser</button>
        <button type="button" id="csv" class="primary">Exporter CSV</button>
      </div>
    </form>
    <div class="legend">
      Taille du point proportionnelle à √P
      <div class="sizes" id="sizes"></div>
    </div>
    <div class="foot" id="foot"></div>
  </aside>
  <div id="map"></div>
</div>
<div id="empty"><div id="emptyMsg"></div></div>

<div id="explSheet" role="dialog" aria-modal="true" aria-labelledby="explTitle">
  <div class="sheet">
    <div class="sh-head">
      <b id="explTitle">Exploitants</b>
      <button type="button" class="x" id="explClose" aria-label="Fermer">×</button>
    </div>
    <input type="search" id="explQ" placeholder="Rechercher un exploitant…" autocomplete="off" enterkeyhint="search">
    <div class="sh-tools"><span id="explCount"></span><button type="button" id="explClear">Tout désélectionner</button></div>
    <div id="explItems" class="sh-list"></div>
    <div class="sh-foot"><button type="button" class="primary" id="explOk">Afficher</button></div>
  </div>
</div>

<div id="card" role="dialog" aria-label="Détail de l'installation">
  <button type="button" class="x" id="cardClose" aria-label="Fermer">×</button>
  <div id="cardBody" class="inst"></div>
  <div id="cardDist"></div>
  <div class="card-act"><a id="cardNav" target="_blank" rel="noopener">Itinéraire</a><a id="cardMap" target="_blank" rel="noopener">Géoportail</a></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const COLORS = {PV:{fill:"#f2a20c",stroke:"#a8650a",label:"Photovoltaïque"},
                BESS:{fill:"#4c4fe0",stroke:"#2a2c9c",label:"Stockage batteries"}};
const NO_EXPL = "Non identifié";
const $ = id => document.getElementById(id);
const fmt = (x, d=1) => x == null ? "–" : x.toLocaleString("fr-FR",{maximumFractionDigits:d});
const fmtDate = s => s ? s.split("-").reverse().join("/") : "n.c.";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

// ---------------------------------------------------------------- carte
const NARROW = matchMedia("(max-width:760px)").matches;
const HOVER = matchMedia("(hover:hover) and (pointer:fine)").matches;
const map = L.map("map",{preferCanvas:true, zoomSnap:.5, minZoom:4, tap:false}).setView(NARROW ? [46.4,2.4] : [46.6,2.4], NARROW ? 5 : 6);
const ATTR_ODRE = ' · Données <a href="https://odre.opendatasoft.com/">ODRÉ</a>, <a href="https://www.openstreetmap.org/copyright">OSM</a>';
const ign = layer => `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layer}&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=`;
const FONDS = {
  ign: L.tileLayer(ign("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2") + "image/png", {maxZoom:19,
    attribution:'&copy; <a href="https://geoservices.ign.fr/">IGN</a> – Plan IGN' + ATTR_ODRE}),
  sat: L.tileLayer(ign("ORTHOIMAGERY.ORTHOPHOTOS") + "image/jpeg", {maxZoom:19,
    attribution:'&copy; <a href="https://geoservices.ign.fr/">IGN</a> – Orthophotos' + ATTR_ODRE}),
  osm: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Données <a href="https://odre.opendatasoft.com/">ODRÉ</a>'}),
};
const FOND_LABELS = {ign:"Plan IGN", sat:"Vue satellite (IGN)", osm:"OpenStreetMap"};
let fond = new URLSearchParams(location.hash.slice(1)).get("fond");
if (!FONDS[fond]) { try { fond = localStorage.getItem("fond"); } catch(e) {} }
if (!FONDS[fond]) fond = "ign";
FONDS[fond].addTo(map);
L.control.layers(Object.fromEntries(Object.entries(FONDS).map(([k,v]) => [FOND_LABELS[k], v])), null,
  {position:"topright", collapsed:NARROW || !HOVER}).addTo(map);

// ---------------------------------------------------------------- position GPS
// Sur téléphone / tablette, la position est suivie en continu dès l'ouverture (après autorisation).
const locLayer = L.layerGroup().addTo(map);
let ME = null, watchId = null, locBtn = null, follow = false, meDot = null, meAcc = null;
const LocCtl = L.Control.extend({options:{position:"topleft"}, onAdd(){
  const d = L.DomUtil.create("div","leaflet-bar");
  locBtn = L.DomUtil.create("button","loc-btn",d);
  locBtn.type = "button"; locBtn.title = "Ma position"; locBtn.setAttribute("aria-label","Afficher et centrer ma position");
  locBtn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2"/></svg>';
  L.DomEvent.disableClickPropagation(d);
  locBtn.onclick = () => startGps(true);
  return d; }});
new LocCtl().addTo(map);
function locState(st){ if (locBtn){ locBtn.classList.toggle("on", st === "on"); locBtn.classList.toggle("wait", st === "wait"); } }
function onPos(pos, fromUser){
  const ll = [pos.coords.latitude, pos.coords.longitude], first = !ME;
  ME = {lat:ll[0], lon:ll[1], acc:pos.coords.accuracy, t:Date.now()};
  if (!meDot){
    meAcc = L.circle(ll, {renderer, radius:ME.acc, color:"#1a73e8", weight:1, fillColor:"#1a73e8", fillOpacity:.10, interactive:false}).addTo(locLayer);
    meDot = L.marker(ll, {icon:L.divIcon({className:"", html:'<div class="loc-dot"></div>', iconSize:[18,18]}),
                          interactive:false, zIndexOffset:1000, keyboard:false}).addTo(locLayer);
  } else { meDot.setLatLng(ll); meAcc.setLatLng(ll).setRadius(ME.acc); }
  locState("on");
  if (follow || (first && fromUser)){ map.setView(ll, Math.max(map.getZoom(), 11)); follow = false; }
  if (cardM) $("cardDist").textContent = distLabel(cardM._p);
  if (pendingNear){ pendingNear = false; nearMe(); }
}
let pendingNear = false;
function startGps(fromUser){
  if (!("geolocation" in navigator)){ if (fromUser) alert("La géolocalisation n'est pas disponible sur cet appareil."); return; }
  if (ME && fromUser){ map.setView([ME.lat, ME.lon], Math.max(map.getZoom(), 12)); }
  if (watchId !== null) return;
  if (fromUser) follow = true;
  locState("wait");
  watchId = navigator.geolocation.watchPosition(p => onPos(p, fromUser), err => {
    navigator.geolocation.clearWatch(watchId); watchId = null; locState("");
    if (fromUser) alert(err.code === 1
      ? "Localisation refusée. Autorisez-la pour ce site : sur iPhone, Réglages › Safari › Position (ou Réglages › Confidentialité › Service de localisation), puis rechargez la page."
      : "Position GPS indisponible pour le moment. Réessayez à l'extérieur ou dans quelques secondes.");
  }, {enableHighAccuracy:true, maximumAge:15000, timeout:30000});
}
function distLabel(p){ return ME ? `À ${fmt(distKm(ME.lat, ME.lon, p.lat, p.lon), 1)} km de vous` : ""; }
map.on("baselayerchange", e => {
  fond = Object.keys(FONDS).find(k => FONDS[k] === e.layer) || "ign";
  try { localStorage.setItem("fond", fond); } catch(err) {}
  if (DATA.length) apply(false);
});
const renderer = L.canvas({padding:.3, tolerance: HOVER ? 3 : 10});
const layer = L.layerGroup().addTo(map);

// rayon : √P, plafonné, légèrement agrandi avec le zoom
const baseR = mw => Math.min(2.6 + 1.9*Math.sqrt(mw), 20);
const zoomK = () => Math.max(.75, Math.min(1.7, 1 + (map.getZoom()-6)*.13));
function drawSizes(){
  const k = zoomK();
  $("sizes").innerHTML = [1,10,50,200].map(mw=>{
    const d = 2*baseR(mw)*k;
    return `<div><i style="width:${d}px;height:${d}px"></i>${mw} MW</div>`;}).join("");
}

let DATA = [], markers = [], META = {};

const EXPL_SRC = {nom:"déduit du nom", osm:"OpenStreetMap", sirene:"via SIRENE", wikidata:"Wikidata", cre:"candidat appel d'offres CRE", fichier:"renseigné manuellement ou recherche documentaire", site:"déduit des autres tranches du site", motif:"déduit de la codification du nom", sirene_commune:"probable : seule société de production de la commune"};
function tooltipHtml(p){
  const c = COLORS[p.type];
  const expl = p.expl
    ? esc(p.expl) + (EXPL_SRC[p.expl_src] ? ` <span style="color:#8a96a3">(${EXPL_SRC[p.expl_src]})</span>` : "")
    : '<span style="color:#8a96a3">non publié au registre</span>';
  const charge = p.type === "BESS" && p.mw_charge ? ` · charge ${fmt(p.mw_charge,2)} MW` : "";
  return `<span class="tag" style="background:${c.fill}">${c.label}${p.techno && p.type==="BESS" && !/batterie/i.test(p.techno) ? " – "+esc(p.techno):""}</span>
  <h3>${esc(p.nom)}</h3>
  <table>
    <tr><td>Puissance</td><td><b>${fmt(p.mw,2)} MW</b>${charge}</td></tr>
    <tr><td>Mise en service</td><td>${fmtDate(p.mes)}${p.mes_src==="raccordement" ? " (date de raccordement)" : ""}</td></tr>
    <tr><td>Exploitant</td><td>${expl}</td></tr>
    ${p.societe ? `<tr><td>Société</td><td>${esc(p.societe)}<br><span style="color:#8a96a3">SIREN ${esc(p.siren)}</span></td></tr>` : ""}
    ${p.ao ? `<tr><td>Appel d'offres</td><td>CRE ${esc(p.ao)}<br><span style="color:#8a96a3">candidat ${esc(p.candidat)}</span></td></tr>` : ""}
    ${p.chaine && p.chaine.includes("→") ? `<tr><td>Actionnariat</td><td style="font-size:12px">${esc(p.chaine.split(" → ").slice(1).join(" → "))}</td></tr>` : ""}
    <tr><td>Commune</td><td>${esc(p.commune)}${p.dep ? " ("+esc(p.dep)+")" : ""}</td></tr>
    <tr><td>Réseau</td><td>${esc(p.grd || "–")}${p.tension ? " · "+esc(p.tension) : ""}</td></tr>
  </table>
  <div class="note">Position : ${p.loc_src === "manuel" ? "corrigée manuellement" + (p.pos_date ? " le " + fmtDate(p.pos_date) : "") : p.loc_src === "osm" ? "emprise OpenStreetMap" : p.loc_src === "wikidata" ? "Wikidata" : "centroïde de la commune"}</div>`;
}

function build(){
  markers = DATA.map(p => {
    const c = COLORS[p.type];
    const m = L.circleMarker([p.lat,p.lon],{renderer, radius:baseR(p.mw)*zoomK(),
      color:"#ffffff", weight:.8, fillColor:c.fill, fillOpacity:.72, opacity:.9});
    if (HOVER && !NARROW){
      m.bindTooltip(() => tooltipHtml(p), {className:"inst", direction:"top", offset:[0,-4], sticky:false});
      m.on("mouseover", () => m.setStyle({color:c.stroke, weight:2}));
      m.on("mouseout",  () => m.setStyle({color:"#ffffff", weight:.8}));
      m.on("click", () => m.openTooltip());
    } else {
      m.on("click", e => { L.DomEvent.stop(e); showCard(m); });
    }
    m._p = p;
    return m;
  });
}
// fiche détaillée (téléphone / tablette)
let cardM = null;
function showCard(m){
  if (cardM && cardM !== m) cardM.setStyle({color:"#ffffff", weight:.8});
  cardM = m; const p = m._p;
  m.setStyle({color:"#18212b", weight:3}); m.bringToFront();
  $("cardBody").innerHTML = tooltipHtml(p);

  $("cardMap").href = `https://www.geoportail.gouv.fr/carte?c=${p.lon},${p.lat}&z=16&l0=ORTHOIMAGERY.ORTHOPHOTOS::GEOPORTAIL:OGC:WMTS(1)&permalink=yes`;

}
function hideCard(){

}
$("cardClose").onclick = hideCard;
map.on("click", hideCard);

map.on("zoomend", () => { const k = zoomK(); markers.forEach(m => m.setRadius(baseR(m._p.mw)*k)); drawSizes(); });

// ---------------------------------------------------------------- filtres
const SIZES = [{lo:0,hi:5,l:"1–5 MW"},{lo:5,hi:12,l:"5–12 MW"},{lo:12,hi:30,l:"12–30 MW"},
               {lo:30,hi:100,l:"30–100 MW"},{lo:100,hi:Infinity,l:"≥ 100 MW"}];
const ALL_S = SIZES.map((_,i)=>String(i));
const sizeOf = mw => SIZES.findIndex(c => mw >= c.lo && mw < c.hi);
const F = {t:["PV","BESS"], s:[...ALL_S], r:"", e:[], c:"", km:"20", pmin:"", pmax:"", y1:"", y2:"", q:""};
let CSEL = null;           // commune choisie {code, nom, dep, lat, lon}
const nearLayer = L.layerGroup().addTo(map);
function distKm(a, b, c, d){
  const R = 6371, r = Math.PI/180, dl = (c-a)*r, dg = (d-b)*r;
  const x = Math.sin(dl/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dg/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

function readForm(){
  F.t = [...document.querySelectorAll('input[name=t]:checked')].map(i=>i.value);
  F.s = [...document.querySelectorAll('input[name=s]:checked')].map(i=>i.value);
  F.r = $("region").value;
  F.c = CSEL && !CSEL.gps ? CSEL.code : "";
  const k = parseFloat($("km").value); F.km = String(isFinite(k) && k > 0 ? Math.min(k, 300) : 20);
  F.pmin = $("pmin").value; F.pmax = $("pmax").value;
  F.y1 = $("y1").value; F.y2 = $("y2").value; F.q = $("q").value.trim();
}
function writeForm(){
  document.querySelectorAll('input[name=t]').forEach(i => i.checked = F.t.includes(i.value));
  document.querySelectorAll('input[name=s]').forEach(i => i.checked = F.s.includes(i.value));
  $("region").value = F.r; explLabel(); $("km").value = F.km || "20"; showCommune(); $("pmin").value = F.pmin; $("pmax").value = F.pmax;
  $("y1").value = F.y1; $("y2").value = F.y2; $("q").value = F.q;
}
function test(p){
  if (!F.t.includes(p.type)) return false;
  if (F.r && p.region !== F.r) return false;
  if (CSEL){ p._d = distKm(CSEL.lat, CSEL.lon, p.lat, p.lon); if (p._d > +F.km) return false; }
  if (F.e.length && !ESEL.has(p.expl || NO_EXPL)) return false;
  if (F.s.length < SIZES.length && !F.s.includes(String(sizeOf(p.mw)))) return false;
  if (F.pmin !== "" && p.mw < +F.pmin) return false;
  if (F.pmax !== "" && p.mw > +F.pmax) return false;
  const y = p.mes ? +p.mes.slice(0,4) : null;
  if (F.y1 !== "" && (y == null || y < +F.y1)) return false;
  if (F.y2 !== "" && (y == null || y > +F.y2)) return false;
  if (F.q){ const q = norm(F.q);
    if (![p.nom,p.commune,p.dep,p.insee,p.expl,p.poste,p.societe,p.siren,p.candidat].some(v => norm(v).includes(q))) return false; }
  return true;
}
let shown = [];
let ESEL = new Set();
function apply(fit){
  readForm();
  ESEL = new Set(F.e);
  layer.clearLayers();
  shown = markers.filter(m => test(m._p));
  // les plus gros d'abord : les petits restent visibles et survolables par-dessus
  shown.forEach(m => layer.addLayer(m));
  const pv = shown.reduce((s,m)=> s + (m._p.type==="PV" ? m._p.mw : 0), 0);
  const be = shown.reduce((s,m)=> s + (m._p.type==="BESS" ? m._p.mw : 0), 0);
  $("sN").textContent = fmt(shown.length,0);
  $("sPV").textContent = fmt(pv,0);
  $("sBESS").textContent = fmt(be,0);
  const h = new URLSearchParams();
  Object.entries(F).forEach(([k,v]) => { const s = Array.isArray(v) ? v.join(k === "e" ? "|" : ",") : v;
    if (s !== "" && !(k==="t" && s==="PV,BESS") && !(k==="s" && s===ALL_S.join(",")) && !(k==="km" && !F.c)) h.set(k,s); });
  if (F.t.length === 0) h.set("t","-");
  if (F.s.length === 0) h.set("s","-");
  if (fond !== "ign") h.set("fond", fond);
  history.replaceState(null, "", h.toString() ? "#"+h.toString() : location.pathname + location.search);
  drawNear(fit);
  if (fit && !CSEL && shown.length && (F.r || F.e.length || F.q)){
    map.fitBounds(L.latLngBounds(shown.map(m=>m.getLatLng())).pad(.08), {maxZoom:11});
  }
}
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  for (const k of Object.keys(F)){
    if (!h.has(k)) continue;
    F[k] = (k === "t" || k === "s") ? (h.get(k) === "-" ? [] : h.get(k).split(","))
         : k === "e" ? h.get(k).split("|").filter(Boolean) : h.get(k);
  }
}

// ---------------------------------------------------------------- recherche autour d'une commune
const GEO = "https://geo.api.gouv.fr/communes";
const GEO_F = "fields=nom,code,codesPostaux,centre,codeDepartement,population&format=json";
function showCommune(){
  $("cBox").hidden = !!CSEL; $("cSel").hidden = !CSEL;
  if (CSEL) $("cName").textContent = CSEL.gps ? "📍 Ma position" : `${CSEL.nom} (${CSEL.dep})`;
}
function drawNear(fit){
  nearLayer.clearLayers();
  if (!CSEL){ $("cRes").innerHTML = ""; return; }
  const km = +F.km, c = [CSEL.lat, CSEL.lon];
  // même canevas que les centrales : un second canevas intercepterait les clics sur les points
  const circle = L.circle(c, {renderer, radius:km*1000, color:"#18212b", weight:1.5, dashArray:"6 6", fill:true, fillOpacity:.04, interactive:false}).addTo(nearLayer);
  L.circleMarker(c, {renderer, radius:5, color:"#fff", weight:2, fillColor:"#18212b", fillOpacity:1, interactive:false}).addTo(nearLayer);
  if (fit) map.fitBounds(circle.getBounds(), {padding:[20,20]});
  const list = shown.map(m => m._p).sort((a,b) => a._d - b._d);
  const mw = list.reduce((s,p) => s + p.mw, 0);
  $("cRes").innerHTML = `<b style="color:var(--ink)">${fmt(list.length,0)} centrale${list.length>1?"s":""}</b> à moins de ${fmt(km,0)} km · ${fmt(mw,0)} MW`
    + (list.length ? `<ol>${list.slice(0,200).map((p,i) => `<li data-i="${DATA.indexOf(p)}"><b><i style="background:${COLORS[p.type].fill}"></i>${esc(p.nom)}</b>`
      + `<em>${fmt(p._d,1)} km</em><span>${esc(p.commune)} · ${esc(p.expl || NO_EXPL)}</span><em>${fmt(p.mw,1)} MW</em></li>`).join("")}</ol>`
      + (list.length > 200 ? `<div style="margin-top:4px">200 plus proches affichées — l'export CSV contient tout.</div>` : "") : "");
}
$("cRes").addEventListener("click", e => {
  const li = e.target.closest("li[data-i]"); if (!li) return;
  const m = markers[+li.dataset.i]; if (!m) return;
  map.setView(m.getLatLng(), Math.max(map.getZoom(), 12));
  if (HOVER && !NARROW) setTimeout(() => m.openTooltip(), 300); else showCard(m);
});
function setCommune(c){
  CSEL = c ? {code:c.code, nom:c.nom, dep:c.codeDepartement || "", lat:c.centre.coordinates[1], lon:c.centre.coordinates[0]} : null;
  $("cq").value = ""; closeSug(); showCommune(); apply(true);
}
let sugItems = [], sugAct = -1, sugReq = 0;
function closeSug(){ $("cSug").classList.remove("open"); $("cq").setAttribute("aria-expanded","false"); sugAct = -1; }
function renderSug(msg){
  const box = $("cSug");
  box.innerHTML = msg ? `<div class="msg">${msg}</div>` : sugItems.map((c,i) =>
    `<button type="button" role="option" data-i="${i}"${i===sugAct?' class="act"':''}><span>${esc(c.nom)}</span>`
    + `<small>${esc(c.codeDepartement)} · ${esc((c.codesPostaux||[])[0] || "")}</small></button>`).join("");
  box.classList.add("open"); $("cq").setAttribute("aria-expanded","true");
}
async function searchCommunes(q){
  const id = ++sugReq;
  const url = /^\d{5}$/.test(q) ? `${GEO}?codePostal=${q}&${GEO_F}`
            : /^\d{2,4}$/.test(q) ? null
            : `${GEO}?nom=${encodeURIComponent(q)}&boost=population&limit=8&${GEO_F}`;
  if (!url){ renderSug("Code postal : 5 chiffres"); return; }
  try{
    const r = await fetch(url); const j = r.ok ? await r.json() : [];
    if (id !== sugReq) return;
    sugItems = j.filter(c => c.centre).slice(0, 8); sugAct = sugItems.length ? 0 : -1;
    renderSug(sugItems.length ? "" : "Aucune commune trouvée");
  }catch(e){ if (id === sugReq) renderSug("Recherche de communes indisponible"); }
}
let cDeb;
$("cq").addEventListener("input", e => {
  e.stopPropagation();
  const q = $("cq").value.trim(); clearTimeout(cDeb);
  if (q.length < 2){ closeSug(); return; }
  cDeb = setTimeout(() => searchCommunes(q), 200);
});
$("cq").addEventListener("keydown", e => {
  if (!$("cSug").classList.contains("open") || !sugItems.length) return;
  if (e.key === "ArrowDown"){ sugAct = (sugAct + 1) % sugItems.length; renderSug(); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ sugAct = (sugAct - 1 + sugItems.length) % sugItems.length; renderSug(); e.preventDefault(); }
  else if (e.key === "Enter"){ e.preventDefault(); setCommune(sugItems[Math.max(0, sugAct)]); }
  else if (e.key === "Escape") closeSug();
});
$("cSug").addEventListener("mousedown", e => e.preventDefault());
$("cSug").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) setCommune(sugItems[+b.dataset.i]); });
$("cq").addEventListener("blur", () => setTimeout(closeSug, 150));
$("cClear").onclick = () => setCommune(null);
$("cMe").onclick = () => nearMe();
function nearMe(){
  if (!ME){ pendingNear = true; startGps(true); return; }
  CSEL = {code:"", nom:"Ma position", dep:"", lat:ME.lat, lon:ME.lon, gps:true};
  $("cq").value = ""; closeSug(); showCommune(); apply(true);
}
async function loadCommune(code){
  try{
    const r = await fetch(`${GEO}/${encodeURIComponent(code)}?${GEO_F}`);
    if (r.ok){ const c = await r.json(); if (c && c.centre) CSEL = {code:c.code, nom:c.nom, dep:c.codeDepartement || "",
      lat:c.centre.coordinates[1], lon:c.centre.coordinates[0]}; }
  }catch(e){}
}

function fillLists(){
  const regs = {};
  DATA.forEach(p => regs[p.region] = (regs[p.region]||0) + 1);
  $("region").insertAdjacentHTML("beforeend", Object.keys(regs).sort((a,b)=>a.localeCompare(b,"fr"))
    .map(r => `<option value="${esc(r)}">${esc(r)} (${regs[r]})</option>`).join(""));
  const sc = SIZES.map(() => 0); DATA.forEach(p => { const i = sizeOf(p.mw); if (i >= 0) sc[i]++; });
  $("sizesF").innerHTML = SIZES.map((c,i) =>
    `<label><input type="checkbox" name="s" value="${i}" checked>${c.l} <small>${sc[i]}</small></label>`).join("");
  const ex = {};
  DATA.forEach(p => { const k = p.expl || NO_EXPL; ex[k] = ex[k] || [0,0]; ex[k][0] += p.mw; ex[k][1]++; });
  EXPLS = Object.entries(ex)
    .sort((a,b) => (b[0]===NO_EXPL) - (a[0]===NO_EXPL) || a[0].localeCompare(b[0],"fr",{sensitivity:"base", numeric:true}))
    .map(([k,v]) => ({k, mw:v[0], n:v[1], s:norm(k)}));
  $("explList").innerHTML = EXPLS.filter(e => e.k !== NO_EXPL)
    .map(e => `<option value="${esc(e.k)}">${fmt(e.mw,0)} MW</option>`).join("");
}

// ---------------------------------------------------------------- sélecteur d'exploitants
let EXPLS = [], draft = new Set();
function explLabel(){
  const n = F.e.length;
  $("explTxt").textContent = !n ? "Tous les exploitants" : n === 1 ? F.e[0] : `${n} exploitants sélectionnés`;
  $("explBtn").classList.toggle("on", n > 0);
}
function renderExpl(){
  const q = norm($("explQ").value.trim());
  const list = q ? EXPLS.filter(e => e.s.includes(q)) : EXPLS;
  let html = "", letter = "";
  list.forEach(e => {
    const L0 = e.k === NO_EXPL ? "★" : (norm(e.k)[0] || "#").toUpperCase().replace(/[^A-Z]/, "#");
    if (!q && L0 !== letter){ letter = L0; html += `<div class="letter">${L0 === "★" ? "—" : L0}</div>`; }
    html += `<label><input type="checkbox" value="${esc(e.k)}"${draft.has(e.k) ? " checked" : ""}>`
          + `<span>${esc(e.k)}</span><small>${fmt(e.mw,0)} MW · ${e.n}</small></label>`;
  });
  $("explItems").innerHTML = html || `<div class="none">Aucun exploitant ne correspond.</div>`;
  $("explCount").textContent = draft.size ? `${draft.size} sélectionné(s)` : `${EXPLS.length} exploitants`;
}
function openExplSheet(){
  draft = new Set(F.e); $("explQ").value = ""; renderExpl();
  $("explSheet").classList.add("open"); $("explItems").scrollTop = 0;
  if (HOVER) setTimeout(() => $("explQ").focus(), 30);
}
function closeExplSheet(applyIt){
  $("explSheet").classList.remove("open");
  if (applyIt){ F.e = [...draft].sort((a,b) => a.localeCompare(b,"fr")); explLabel(); apply(true); }
}

function exportCsv(){
  const cols = ["nom","type","techno","mw","mw_charge","mes","mes_src","expl","expl_src","commune","insee","dep","region","grd","tension","poste","eic","siren","societe","loc_src","lat","lon"];
  if (CSEL){ cols.unshift("distance_km"); shown.forEach(m => m._p.distance_km = Math.round(m._p._d*10)/10); }
  const q = v => { const s = v == null ? "" : String(v); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [cols.join(";")].concat(shown.map(m => cols.map(c => {
    const v = m._p[c]; return typeof v === "number" ? String(v).replace(".",",") : q(v); }).join(";")));
  const blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "installations_pv_bess_filtre.csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

// panneau du bas (téléphone) : hauteur visible = poignée + titre + chiffres clés ; glisser vers le haut / le bas
function setPeek(){
  if (!NARROW) return;
  const st = document.querySelector(".stats");
  const v = (st.offsetTop + st.offsetHeight + 2) + "px";
  $("panel").style.setProperty("--peek", v); document.documentElement.style.setProperty("--peek", v);
}
(() => {
  const pnl = $("panel"); let y0 = null, dy = 0, startOpen = false;
  const zone = e => e.target.closest("#toggle, .head, .stats");
  pnl.addEventListener("touchstart", e => {
    if (!NARROW || !zone(e) || (pnl.classList.contains("open") && pnl.scrollTop > 0)) return;
    y0 = e.touches[0].clientY; dy = 0; startOpen = pnl.classList.contains("open"); pnl.classList.add("dragging");
  }, {passive:true});
  pnl.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    const h = pnl.offsetHeight, peek = parseFloat(getComputedStyle(pnl).getPropertyValue("--peek")) || 150;
    const base = startOpen ? 0 : h - peek;
    pnl.style.transform = `translateY(${Math.max(0, Math.min(h - peek, base + dy))}px)`;
  }, {passive:true});
  pnl.addEventListener("touchend", () => {
    if (y0 === null) return;
    pnl.classList.remove("dragging"); pnl.style.transform = "";
    if (Math.abs(dy) > 40){ pnl.classList.toggle("open", dy < 0); if (dy < 0) hideCard(); }
    y0 = null;
  });
})();
addEventListener("resize", setPeek);

fetch("data/installations.json", {cache:"no-cache"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(async j => {
    META = j.meta;
    DATA = j.rows.map(r => Object.fromEntries(j.fields.map((f,i) => [f, r[i]])));
    await EDIT.load(); EDIT.applyTo(DATA);
    const d = new Date(META.genere_le);
    $("sub").textContent = `${fmt(META.n,0)} installations · registre national ODRÉ · mis à jour le ${d.toLocaleDateString("fr-FR")}`;
    $("foot").innerHTML = `Source : ${esc(META.source)}. Seuil : puissance installée &gt; ${fmt(META.seuil_kw/1000,1)} MW, installations en service non déraccordées. `

      + `L'exploitant n'est pas publié au registre : il provient, par ordre de priorité, de <code>data/exploitants.csv</code>, de la base SIRENE (société de projet et chaîne d'actionnaires), des lauréats des appels d'offres CRE, d'OpenStreetMap, de Wikidata, ou du nom de l'installation.`
      + (META.osm && META.osm.localisees ? ` ${fmt(META.osm.localisees,0)} installations positionnées sur leur emprise OpenStreetMap, les autres au centroïde de la commune.` : "")
      + (META.sans_coordonnees ? ` ${META.sans_coordonnees} installation(s) non géolocalisée(s).` : "");
    fillLists(); build(); EDIT.attach(markers); drawSizes(); readHash();
    if (F.c) await loadCommune(F.c);
    writeForm(); apply(true); setPeek();
    if (NARROW || !HOVER) startGps(false);   // téléphone / tablette : position affichée d'emblée
  })
  .catch(err => {
    $("emptyMsg").innerHTML = `<b>Données absentes.</b><br>Le fichier <code>data/installations.json</code> n'a pas encore été généré. `
      + `Lancez l'action GitHub « Mise à jour des données » (onglet Actions → Run workflow) ou <code>python scripts/build_data.py</code> en local.`;
    $("empty").style.display = "flex"; $("sub").textContent = "Aucune donnée"; console.error(err);
  });
</script>
